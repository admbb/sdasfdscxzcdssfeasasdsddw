  - RULE-SET,media_rules,🔯 故障转移

  - RULE-SET,google_domain,🔯 故障转移
  - RULE-SET,google_ip,🔯 故障转移,no-resolve
  - RULE-SET,github_domain,🔯 故障转移
  - RULE-SET,onedrive_domain,🔯 故障转移
  - RULE-SET,microsoft_domain,🔯 故障转移
  - RULE-SET,paypal_domain,🔯 故障转移

  - RULE-SET,apple_domain,DIRECT
  - RULE-SET,apple_ip,DIRECT,no-resolve
  - RULE-SET,accept_rules,🔯 故障转移

  - RULE-SET,steamcn_domain,DIRECT
  - RULE-SET,games_direct_domain,DIRECT
  - RULE-SET,steam_domain,🔯 故障转移
  - RULE-SET,epic_domain,🔯 故障转移
  - RULE-SET,origin_domain,🔯 故障转移
  - RULE-SET,ea_domain,🔯 故障转移
  - RULE-SET,playstation_domain,🔯 故障转移
  - RULE-SET,xbox_domain,🔯 故障转移
  - RULE-SET,nintendo_domain,🔯 故障转移
  - RULE-SET,games_proxy_domain,🔯 故障转移
  - RULE-SET,proxy_domain,🔯 故障转移

  - DOMAIN-SUFFIX,wensitang.site,DIRECT
  - DOMAIN-SUFFIX,frp-cat.com,DIRECT

  - RULE-SET,cn_domain,DIRECT
  - RULE-SET,cn_ip,DIRECT,no-resolve

  - MATCH,🐟 漏网之鱼
  
