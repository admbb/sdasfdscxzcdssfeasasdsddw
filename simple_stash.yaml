mode: rule
mixed-port: 7890
allow-lan: true
bind-address: '*'
ipv6: false
log-level: warning
profile:
  store-selected: true
dns:
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  follow-rule: false
  skip-cert-verify: true
  fake-ip-filter:
    - +.stun.*.*
    - +.stun.*.*.*
    - +.stun.*.*.*.*
    - +.stun.*.*.*.*.*
    - lens.l.google.com
    - '*.n.n.srv.nintendo.net'
    - +.stun.playstation.net
    - xbox.*.*.microsoft.com
    - '*.*.xboxlive.com'
    - '*.msftncsi.com'
    - '*.msftconnecttest.com'
    - Mijia Cloud
    - +.push.apple.com
    - www-d-gstatic-d-com-s-gmn.v.tuangouai.com
    - '*.gstatic.com'
    - cp.cloudflare.com
    - captive.apple.com
    - '*.apple.com'
    - router.asus.com
    - '*.lan'
    - '*.local'
proxy-providers:
  all:
    url: https://gist.githubusercontent.com/admbb/3f29c718a84c10cd1507cb1ff232f56d/raw/github_mihomo
    path: ./providers/all.yaml
    interval: 86400
proxies:
  - name: 🇯🇵 日本_vmess_ipv6_zj
    type: vmess
    server: natjp5-2.bytevirt.net
    port: 32515
    uuid: 081dbf5a-d8b6-40c8-96f8-3c4ca9f50442
    alterId: 0
    cipher: auto
    tls: false
    skip-cert-verify: true
    tfo: false

  - name: 🇯🇵 日本_ss_ipv6_zj_ip
    type: ss
    server: "2a12:bec0:164:1007::"
    port: 32516
    cipher: aes-256-gcm
    password: MANw38CesW
    dialer-proxy: 🛠️ 机场节点

proxy-groups:
  - name: 🔯 故障转移
    type: fallback
    url: http://cp.cloudflare.com/generate_204
    interval: 1800
    timeout: 3000
    lazy: true
    proxies:
      - 🛠️ 机场节点
      - 🚀 自建节点

  - name: 🛠️ 机场节点
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 1800
    timeout: 3000
    lazy: true
    tolerance: 100
    use:
      - all

  - name: 🚀 自建节点
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 1800
    timeout: 3000
    lazy: true
    tolerance: 100
    proxies:
      - 🇯🇵 日本_vmess_ipv6_zj
      - 🇯🇵 日本_ss_ipv6_zj_ip

  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - DIRECT
      - 🛠️ 机场节点
      - 🚀 自建节点

  - name: 🚫 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT
      - 🛠️ 机场节点
      - 🚀 自建节点
      
rules:
  - DST-PORT,1883,DIRECT
  - DST-PORT,8123,DIRECT
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve

  - RULE-SET,ads_domain,🚫 广告拦截
