proxy-providers:
  all:
    url: "https://gist.githubusercontent.com/admbb/3f29c718a84c10cd1507cb1ff232f56d/raw/github_mihomo"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www-d-gstatic-d-com-s-gmn.v.tuangouai.com/generate_204
      interval: 300
      proxy: DIRECT
  
# 节点信息
proxies:
  - {name: 🇯🇵 日本_vmess_ipv6_zj, server: natjp5-2.bytevirt.net, port: 32515, type: vmess, uuid: 081dbf5a-d8b6-40c8-96f8-3c4ca9f50442, alterId: 0, cipher: auto, tls: false, skip-cert-verify: true, tfo: false}
  - {name: 🇯🇵 日本_vmess_ipv6_zj_中转, server: natjp5-2.bytevirt.net, port: 32515, type: vmess, uuid: 081dbf5a-d8b6-40c8-96f8-3c4ca9f50442, alterId: 0, cipher: auto, tls: false, skip-cert-verify: true, tfo: false, dialer-proxy: 🛠️ 机场节点}
  - {name: 🇸🇬 新加坡_vless_zj, server: 188.253.125.140, port: 443, client-fingerprint: chrome, encryption: none, network: tcp, reality-opts: {public-key: SGhLv4Jp85RIdf-bvQnW9hD1tnYknzAdJtnRKtU6glg, short-id: df4918768a0b64e4}, servername: www.compliance.sony.eu, tls: true, type: vless, udp: true, uuid: ae66a655-d529-412d-a7d5-2b933d18c4ee, xudp: true, skip-cert-verify: true, tfo: false}
  - {name: 🇸🇬 新加坡_vless_zj_中转, server: 188.253.125.140, port: 443, client-fingerprint: chrome, encryption: none, network: tcp, reality-opts: {public-key: SGhLv4Jp85RIdf-bvQnW9hD1tnYknzAdJtnRKtU6glg, short-id: df4918768a0b64e4}, servername: www.compliance.sony.eu, tls: true, type: vless, udp: true, uuid: ae66a655-d529-412d-a7d5-2b933d18c4ee, xudp: true, skip-cert-verify: true, tfo: false, dialer-proxy: 🛠️ 机场节点}

# 全局配置 
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: false
  store-fake-ip: true

# 嗅探（fakeip下其实可以不用嗅探）
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
    - 'www-d-gstatic-d-com-s-gmn.v.tuangouai.com'
    - '*.gstatic.com'
    - 'cp.cloudflare.com'
    # --- 排除系统网络探测与本地设备 ---
    - 'captive.apple.com' # 苹果网络连通性检测
    - '*.apple.com'
    - 'router.asus.com'   # 路由器后台
    - '*.lan'             # 局域网域名
    - '*.local'

# 入站
tun:
  enable: false # [修改优化] 改为 false，交由 Clash Party 界面上的“虚拟网卡”开关控制
  # system/gvisor/mixed
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  #使用nikki，混入全部不修改的情况，开启接口指定为nikki
  #device: nikki
  #使用仅内核自行修改下面三项为true
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS模块
dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:fakeipfilter_domain"
  default-nameserver:
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

# 出站策略
# 🛠️ 预定义锚点 (公共节点列表，不被解析为真实组)
# =========================================
pr: &common_proxies [🔯 故障转移, 🌐 手动选择, ♻️ 自动选择, ♻️ 香港自动, ♻️ 日本自动, ♻️ 狮城自动, ♻️ 美国自动, ♻️ 其他自动]
pr_direct: &common_proxies_direct [DIRECT, 🔯 故障转移, 🌐 手动选择, ♻️ 自动选择, ♻️ 香港自动, ♻️ 日本自动, ♻️ 狮城自动, ♻️ 美国自动, ♻️ 其他自动]
pr_reject: &common_proxies_reject [REJECT, DIRECT, 🔯 故障转移, 🌐 手动选择, ♻️ 自动选择, ♻️ 香港自动, ♻️ 日本自动, ♻️ 狮城自动, ♻️ 美国自动, ♻️ 其他自动]
proxy-groups:
  # =========================================
  # 📌 1. 核心控制与基础组
  # =========================================
  - name: 🌐 手动选择
    type: select
    include-all: true
    exclude-filter: "(家|官网|剩余|流量|套餐|到期|重置|更新|网站|客户端|如果|请|谢谢)"

  - name: 🔯 故障转移
    type: fallback
    url: http://cp.cloudflare.com/generate_204
    interval: 900
    timeout: 3000
    expected-status: 204
    empty-fallback: DIRECT
    lazy: true
    proxies: [✈️ yyss节点, ✈️ nb节点, 🚀 自建节点]

  - name: 🐟 漏网之鱼
    type: select
    proxies: *common_proxies_direct

  - name: 🚫 广告拦截
    type: select
    proxies: *common_proxies_reject
    hidden: true
    
  # =========================================
  # 🤖 2. 应用与网站分流组
  # =========================================
  - name: 🤖 GPT
    type: url-test
    empty-fallback: DIRECT
    lazy: true
    include-all: true
    tolerance: 50
    interval: 300
    filter: "(?i)(AI|Gemini|GPT|Claude|.*zj)"
    url: https://chatgpt.com/favicon.ico

  - name: 🤖 Gemini
    type: url-test
    empty-fallback: DIRECT
    lazy: true
    include-all: true
    tolerance: 50
    interval: 300
    filter: "^(?:(?=.*Gemini)(?=.*[新日美])|.*zj).*"
    url: https://gemini.google.com/favicon.ico

  - name: 🍀 Google
    type: select
    proxies: *common_proxies

  - name: 👨🏿‍💻 GitHub
    type: select
    proxies: *common_proxies

  - name: 🐬 OneDrive
    type: select
    proxies: *common_proxies

  - name: 🪟 Microsoft
    type: select
    proxies: *common_proxies_direct

  - name: 🎵 TikTok
    type: select
    proxies: *common_proxies

  - name: 🎶 Spotify
    type: select
    proxies: *common_proxies

  - name: 📲 Telegram
    type: select
    proxies: *common_proxies

  - name: 🎮 Games
    type: select
    proxies: *common_proxies

  - name: 💶 PayPal
    type: select
    proxies: *common_proxies
    
  # =========================================
  # 🎬 3. 流媒体专区
  # =========================================
  - name: 📹 YouTube
    type: select
    proxies: [📀 媒体影院, 🎥 NETFLIX, 🔯 故障转移, 🌐 手动选择, ♻️ 自动选择, ♻️ 香港自动, ♻️ 日本自动, ♻️ 狮城自动, ♻️ 美国自动, ♻️ 其他自动]
  
  - name: 🎥 NETFLIX
    type: url-test
    empty-fallback: DIRECT
    lazy: true
    tolerance: 50
    interval: 900
    include-all: true
    filter: "(?i)netflix|流媒体|yyss"
    url: https://www.netflix.com/favicon.ico

  - name: 📀 媒体影院
    type: fallback
    url: http://cp.cloudflare.com/generate_204
    interval: 900
    timeout: 3000
    expected-status: 204
    empty-fallback: DIRECT
    lazy: true
    proxies: [✈️ yyss节点, ✈️ nb节点, 🚀 自建节点]

  # =========================================
  # 🌍 4. 地区节点筛选
  # =========================================
  - name: 🇭🇰 香港节点
    type: select
    include-all: true
    empty-fallback: DIRECT
    filter: "(港|HK|(?i)Hong)"
    exclude-filter: "(台|日|韩|新|深|美|家|官网|剩余|流量|套餐|到期|重置|更新|网站|客户端|如果|请|谢谢)"
    hidden: true

  - name: 🇯🇵 日本节点
    type: select
    include-all: true
    empty-fallback: DIRECT
    filter: "(日|JP|(?i)Japan)"
    exclude-filter: "(港|台|韩|新|美|家|官网|剩余|流量|套餐|到期|重置|更新|网站|客户端|如果|请|谢谢)"
    hidden: true

  - name: 🇸🇬 狮城节点
    type: select
    include-all: true
    empty-fallback: DIRECT
    filter: "(新加坡|坡|狮城|SG|Singapore)"
    exclude-filter: "(台|日|韩|深|美|家|官网|剩余|流量|套餐|到期|重置|更新|网站|客户端|如果|请|谢谢)"
    hidden: true

  - name: 🇺🇲 美国节点
    type: select
    include-all: true
    empty-fallback: DIRECT
    filter: "(美|US|(?i)States|America)"
    exclude-filter: "(港|台|韩|新|日|家|官网|剩余|流量|套餐|到期|重置|更新|网站|客户端|如果|请|谢谢)"
    hidden: true

  # =========================================
  # ⚡ 5. 自动测速组 (Url-Test)
  # =========================================
  - name: ♻️ 自动选择
    type: url-test
    empty-fallback: DIRECT
    lazy: true
    tolerance: 50
    interval: 900
    proxies: [🚀 自建节点, ✈️ yyss节点, ✈️ nb节点]
    url: http://cp.cloudflare.com/generate_204

  - name: ♻️ 香港自动
    type: url-test
    empty-fallback: DIRECT
    lazy: true
    include-all: true
    tolerance: 50
    interval: 900
    filter: "(港|HK|(?i)Hong)"
    exclude-filter: "(台|日|韩|新|深|美|家|官网|剩余|流量|套餐|到期|重置|更新|网站|客户端|如果|请|谢谢|zj)"
    url: http://cp.cloudflare.com/generate_204

  - name: ♻️ 日本自动
    type: url-test
    empty-fallback: DIRECT
    lazy: true
    include-all: true
    tolerance: 50
    interval: 900
    filter: "(日|JP|(?i)Japan)"
    exclude-filter: "(港|台|韩|新|美|家|官网|剩余|流量|套餐|到期|重置|更新|网站|客户端|如果|请|谢谢|zj)"
    url: http://cp.cloudflare.com/generate_204

  - name: ♻️ 狮城自动
    type: url-test
    empty-fallback: DIRECT
    lazy: true
    include-all: true
    tolerance: 50
    interval: 900
    filter: "(新加坡|坡|狮城|SG|Singapore)"
    exclude-filter: "(港|台|韩|日|美|家|官网|剩余|流量|套餐|到期|重置|更新|网站|客户端|如果|请|谢谢|zj)"
    url: http://cp.cloudflare.com/generate_204

  - name: ♻️ 美国自动
    type: url-test
    empty-fallback: DIRECT
    lazy: true
    include-all: true
    tolerance: 50
    interval: 900
    filter: "(美|US|(?i)States|America)"
    exclude-filter: "(港|台|日|韩|新|家|官网|剩余|流量|套餐|到期|重置|更新|网站|客户端|如果|请|谢谢)"
    url: http://cp.cloudflare.com/generate_204

  - name: ♻️ 其他自动
    type: url-test
    empty-fallback: DIRECT
    lazy: true
    include-all: true
    tolerance: 50
    interval: 900
    exclude-filter: "(港|新|日|美|过滤|直连|家|官网|剩余|流量|套餐|到期|重置|更新|网站|客户端|如果|请|谢谢)"
    url: http://cp.cloudflare.com/generate_204

  # =========================================
  # ✈️ 6. 机场/底层节点池
  # =========================================
  - name: ✈️ yyss节点
    type: url-test
    empty-fallback: DIRECT
    lazy: true
    include-all: true
    tolerance: 50
    interval: 900
    filter: "yyss"
    url: http://cp.cloudflare.com/generate_204

  - name: ✈️ nb节点
    type: url-test
    empty-fallback: DIRECT
    lazy: true
    include-all: true
    tolerance: 50
    interval: 900
    filter: "nb"
    url: http://cp.cloudflare.com/generate_204

  - name: 🛠️ 机场节点
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 900
    timeout: 3000
    expected-status: 204
