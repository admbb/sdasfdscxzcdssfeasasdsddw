proxy-providers:
  all:
    url: "https://gist.githubusercontent.com/admbb/3f29c718a84c10cd1507cb1ff232f56d/raw/github_mihomo"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: "https://www-d-gstatic-d-com-s-gmn.v.tuangouai.com/generate_204"
      interval: 600          # [优化] 300→600，降低全节点健康检查频率，减少连接数峰值
      proxy: DIRECT

# 节点信息
proxies:
  - {name: 🇯🇵 日本_vmess_ipv6_zj, server: natjp5-2.bytevirt.net, port: 32515, type: vmess, uuid: 081dbf5a-d8b6-40c8-96f8-3c4ca9f50442, alterId: 0, cipher: auto, tls: false, skip-cert-verify: true, tfo: false}
  - {name: 🇯🇵 日本_ss_ipv6_zj_ip, server: "2a12:bec0:164:1007::", port: 32516, type: ss, cipher: aes-256-gcm, password: MANw38CesW, dialer-proxy: 🛠️ 机场节点}
  - {name: 🇯🇵 日本_vless_ipv6_zj_ip, server: "2a12:bec0:164:1007::", port: 32517, type: vless, uuid: 9534792e-811b-4540-e351-1abdb4beb331, tls: false, skip-cert-verify: true, tfo: false, dialer-proxy: 🛠️ 机场节点}
  - {name: 🇯🇵 日本_vmess_ipv6_zj_中转, server: natjp5-2.bytevirt.net, port: 32515, type: vmess, uuid: 081dbf5a-d8b6-40c8-96f8-3c4ca9f50442, alterId: 0, cipher: auto, tls: false, skip-cert-verify: true, tfo: false, dialer-proxy: 🛠️ 机场节点}
  - {name: 🇸🇬 新加坡_vless_zj, server: 188.253.125.140, port: 443, client-fingerprint: chrome, encryption: none, network: tcp, reality-opts: {public-key: SGhLv4Jp85RIdf-bvQnW9hD1tnYknzAdJtnRKtU6glg, short-id: df4918768a0b64e4}, servername: www.compliance.sony.eu, tls: true, type: vless, udp: true, uuid: ae66a655-d529-412d-a7d5-2b933d18c4ee, xudp: true, skip-cert-verify: true, tfo: false}
  - {name: 🇸🇬 新加坡_vless_zj_中转, server: 188.253.125.140, port: 443, client-fingerprint: chrome, encryption: none, network: tcp, reality-opts: {public-key: SGhLv4Jp85RIdf-bvQnW9hD1tnYknzAdJtnRKtU6glg, short-id: df4918768a0b64e4}, servername: www.compliance.sony.eu, tls: true, type: vless, udp: true, uuid: ae66a655-d529-412d-a7d5-2b933d18c4ee, xudp: true, skip-cert-verify: true, tfo: false, dialer-proxy: 🛠️ 机场节点}

# 全局配置
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
global-client-fingerprint: chrome
keep-alive-idle: 120        # [优化] 600→120，空闲连接 2 分钟回收，防止端口堆积
keep-alive-interval: 10     # [优化] 15→10，更频繁探测保活状态
profile:
  store-selected: true
  store-fake-ip: true

# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
    - 'www-d-gstatic-d-com-s-gmn.v.tuangouai.com'
    - '*.gstatic.com'
    - 'cp.cloudflare.com'
    - 'captive.apple.com'
    - '*.apple.com'
    - 'router.asus.com'
    - '*.lan'
    - '*.local'

# 入站 (Linux 裸核 TUN 配置)
tun:
  enable: true
  stack: system
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: true

# DNS模块
dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:fakeipfilter_domain"
  default-nameserver:
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

# 外部控制面板配置
external-controller: 0.0.0.0:9090
secret: "88888888"
external-ui: ui
external-ui-name: metacubexd
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"

# 出站策略
pr: &common_proxies [🔯 故障转移, 🌐 手动选择, ♻️ 自动选择, ♻️ 香港自动, ♻️ 日本自动, ♻️ 狮城自动, ♻️ 美国自动, ♻️ 其他自动, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🇺🇲 美国节点]
pr_direct: &common_proxies_direct [DIRECT, 🔯 故障转移, 🌐 手动选择, ♻️ 自动选择, ♻️ 香港自动, ♻️ 日本自动, ♻️ 狮城自动, ♻️ 美国自动, ♻️ 其他自动, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🇺🇲 美国节点]
pr_reject: &common_proxies_reject [REJECT, DIRECT, 🔯 故障转移, 🌐 手动选择, ♻️ 自动选择, ♻️ 香港自动, ♻️ 日本自动, ♻️ 狮城自动, ♻️ 美国自动, ♻️ 其他自动, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🇺🇲 美国节点]

proxy-groups:
  # =========================================
  # 📌 1. 核心控制与基础组
  # =========================================
  - name: 🌐 手动选择
    type: select
    include-all: true
    exclude-filter: "(家|官网|剩余|流量|套餐|到期|重置|更新|网站|客户端|如果|请|谢谢)"

  - name: 🔯 故障转移
    type: fallback
    url: http://cp.cloudflare.com/generate_204
    interval: 900
    timeout: 3000
    expected-status: 204
    empty-fallback: DIRECT
    lazy: true
    proxies: [✈️ yyss节点, ✈️ nb节点, 🚀 自建节点, ✈️ mj节点]

  - name: 🐟 漏网之鱼
    type: select
    proxies: *common_proxies_direct

  - name: 🚫 广告拦截
    type: select
    proxies: *common_proxies_reject

  # =========================================
  # 🤖 2. 应用与网站分流组
  # =========================================
  - name: 🤖 GPT
    type: url-test
    empty-fallback: DIRECT
    lazy: true
    include-all: true
    tolerance: 100          # [优化] 50→100，减少轻微波动导致的重测换节点
    interval: 600           # [优化] 300→600，降低测速频率
    timeout: 3000           # [优化] 新增，卡死连接 3 秒超时释放
    filter: "(?i)(AI|Gemini|GPT|Claude|.*zj)"
    url: https://chatgpt.com/favicon.ico

  - name: 🤖 Gemini
    type: url-test
    empty-fallback: DIRECT
    lazy: true
    include-all: true
    tolerance: 100          # [优化] 50→100
    interval: 600           # [优化] 300→600
    timeout: 3000           # [优化] 新增
    filter: "^(?:(?=.*Gemini)(?=.*[新日美])|.*zj).*"
    url: https://gemini.google.com/favicon.ico

  - name: 🍀 Google
    type: select
    proxies: *common_proxies

  - name: 👨🏿‍💻 GitHub
    type: select
    proxies: *common_proxies

  - name: 🐬 OneDrive
    type: select
    proxies: *common_proxies

  - name: 🪟 Microsoft
    type: select
    proxies: *common_proxies_direct

  - name: 🎵 TikTok
    type: select
    proxies: *common_proxies

  - name: 🎶 Spotify
    type: select
    proxies: *common_proxies

  - name: 📲 Telegram
    type: select
    proxies: *common_proxies

  - name: 🎮 Games
    type: select
    proxies: *common_proxies

  - name: 💶 PayPal
    type: select
    proxies: *common_proxies

  # =========================================
  # 🎬 3. 流媒体专区
  # =========================================
  - name: 📹 YouTube
    type: select
    proxies: [📀 媒体影院, 🎥 NETFLIX, 🔯 故障转移, 🌐 手动选择, ♻️ 自动选择, ♻️ 香港自动, ♻️ 日本自动, ♻️ 狮城自动, ♻️ 美国自动, ♻️ 其他自动, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🇺🇲 美国节点]

  - name: 🎥 NETFLIX
    type: fallback
    url: http://cp.cloudflare.com/generate_204
    interval: 900
    timeout: 3000
    expected-status: 204
    empty-fallback: DIRECT
    lazy: true
    proxies: [🎥 yyss_NETFLIX节点, 🎥 zzsj_NETFLIX节点, 🎥 nb_NETFLIX节点, 🌐 手动选择]

  - name: 🎥 yyss_NETFLIX节点
    type: url-test
    empty-fallback: DIRECT
    lazy: true
    tolerance: 100          # [优化] 50→100
    interval: 1200          # [优化] 900→1200
    timeout: 3000           # [优化] 新增
    include-all: true
    filter: "(?i)^(?=.*yyss)(?=.*(netflix|流媒体)).*$"
    url: https://www.netflix.com/favicon.ico

  - name: 🎥 zzsj_NETFLIX节点
    type: url-test
    empty-fallback: DIRECT
    lazy: true
    tolerance: 100          # [优化] 50→100
    interval: 1200          # [优化] 900→1200
    timeout: 3000           # [优化] 新增
    include-all: true
    filter: "(?i)^(?=.*zzsj)(?=.*(netflix|流媒体)).*$"
    url: https://www.netflix.com/favicon.ico

  - name: 🎥 nb_NETFLIX节点
    type: url-test
    empty-fallback: DIRECT
    lazy: true
    tolerance: 100          # [优化] 50→100
    interval: 1200          # [优化] 900→1200
    timeout: 3000           # [优化] 新增
    include-all: true
    filter: "(?i)^(?=.*nb)(?=.*(netflix|流媒体)).*$"
    url: https://www.netflix.com/favicon.ico

  - name: 📀 媒体影院
    type: fallback
    url: http://cp.cloudflare.com/generate_204
