    type: url-test
    empty-fallback: DIRECT
    lazy: true
    tolerance: 100          # [优化] 50→100
    interval: 1200          # [优化] 900→1200
    timeout: 3000           # [优化] 新增
    proxies: [🚀 自建节点, ✈️ mj节点, ✈️ yyss节点, ✈️ nb节点]
