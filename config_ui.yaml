# [优化] 锚点不再含 interval，改为每个 provider 独立指定，实现错峰刷新
rule-anchor:
  ip: &ip {type: http, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, behavior: domain, format: mrs}
  class: &class {type: http, behavior: classical, format: text}
  yaml: &yaml {type: http, behavior: classical, format: yaml}

rule-providers:
  # =========================================
  # 🔴 高频更新档 (~12h，每项间隔 300s 抖动错峰)
