mode: rule

proxy-providers:
  all:
    type: http
    url: "https://gist.githubusercontent.com/admbb/3f29c718a84c10cd1507cb1ff232f56d/raw/github_mihomo"
    path: ./providers/all.yaml
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 900
      timeout: 5000
      lazy: true
      expected-status: 204

proxies:
  - name: 🇯🇵 日本_vmess_ipv6_zj
    server: natjp5-2.bytevirt.net
    port: 32515
    type: vmess
    uuid: 081dbf5a-d8b6-40c8-96f8-3c4ca9f50442
    alterId: 0
    cipher: auto
    tls: false
    skip-cert-verify: true
    tfo: true

  - name: 🇯🇵 日本_ss_ipv6_zj_ip
    server: "2a12:bec0:164:1007::"
    port: 32516
    type: ss
    cipher: aes-256-gcm
    password: MANw38CesW
    tfo: true
    dialer-proxy: 🛠️ 机场节点

mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
global-client-fingerprint: chrome
keep-alive-idle: 120
keep-alive-interval: 10

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
  skip-domain:
    - Mijia Cloud
    - +.push.apple.com
    - www-d-gstatic-d-com-s-gmn.v.tuangouai.com
    - "*.gstatic.com"
    - cp.cloudflare.com
    - captive.apple.com
    - "*.apple.com"
    - router.asus.com
    - "*.lan"
    - "*.local"

tun:
  enable: true
  stack: system
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: true
  endpoint-independent-nat: true

dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:fakeipfilter_domain"

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query

  nameserver-policy:
    "rule-set:cn_domain":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query

external-controller: 127.0.0.1:9090
secret: "88888888"
external-ui: ui
external-ui-name: metacubexd
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"

proxy-groups:
  - name: 🔯 故障转移
    type: fallback
    url: http://cp.cloudflare.com/generate_204
    interval: 1800
    timeout: 3000
    expected-status: 204
    empty-fallback: DIRECT
    lazy: true
    proxies:
      - 🚀 自建节点
      - 🛠️ 机场节点

  - name: 🚀 自建节点
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 1800
    timeout: 3000
    tolerance: 100
    lazy: true
    proxies:
      - 🇯🇵 日本_vmess_ipv6_zj
      - 🇯🇵 日本_ss_ipv6_zj_ip

  - name: 🛠️ 机场节点
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 1800
    timeout: 3000
    tolerance: 100
    lazy: true
    use:
      - all

  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - DIRECT
      - 🔯 故障转移
      - 🛠️ 机场节点
      - 🚀 自建节点

  - name: 🚫 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT
      - 🔯 故障转移
      - 🛠️ 机场节点
      - 🚀 自建节点

rules:
  - DST-PORT,6881-6889,DIRECT
  - AND,((NETWORK,UDP),(DST-PORT,443),(RULE-SET,google_domain)),REJECT
  - AND,((NETWORK,UDP),(DST-PORT,443),(RULE-SET,youtube_domain)),REJECT

  - DST-PORT,22,DIRECT
  - DST-PORT,1883,DIRECT
  - DST-PORT,8123,DIRECT

  - RULE-SET,private_domain,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve

  - RULE-SET,ads_domain,🚫 广告拦截
  - RULE-SET,trackerslist_domain,DIRECT
  - RULE-SET,reject_rules,🚫 广告拦截
  - RULE-SET,AWAvenue-Ads_domain,🚫 广告拦截

  - RULE-SET,gemini_domain,🔯 故障转移
  - RULE-SET,openai_domain,🔯 故障转移
  - RULE-SET,ai_domain,🔯 故障转移
  - RULE-SET,ai_ip,🔯 故障转移,no-resolve

  - RULE-SET,youtube_domain,🔯 故障转移
  - RULE-SET,netflix_domain,🔯 故障转移
  - RULE-SET,netflix_ip,🔯 故障转移,no-resolve
  - RULE-SET,spotify_domain,🔯 故障转移
  - RULE-SET,tiktok_domain,🔯 故障转移
  - RULE-SET,telegram_domain,🔯 故障转移
  - RULE-SET,telegram_ip,🔯 故障转移,no-resolve
  - RULE-SET,media_rules,🔯 故障转移

  - RULE-SET,google_domain,🔯 故障转移
  - RULE-SET,google_ip,🔯 故障转移,no-resolve
  - RULE-SET,github_domain,🔯 故障转移
  - RULE-SET,paypal_domain,🔯 故障转移
  - RULE-SET,apple_domain,DIRECT
  - RULE-SET,apple_ip,DIRECT,no-resolve
  - RULE-SET,accept_rules,🔯 故障转移

  - RULE-SET,steamcn_domain,DIRECT
  - RULE-SET,games_direct_domain,DIRECT
  - RULE-SET,steam_domain,🔯 故障转移
  - RULE-SET,epic_domain,🔯 故障转移
  - RULE-SET,origin_domain,🔯 故障转移
  - RULE-SET,ea_domain,🔯 故障转移
  - RULE-SET,playstation_domain,🔯 故障转移
  - RULE-SET,xbox_domain,🔯 故障转移
  - RULE-SET,nintendo_domain,🔯 故障转移
  - RULE-SET,games_proxy_domain,🔯 故障转移

  - RULE-SET,proxy_domain,🔯 故障转移

  - DOMAIN-SUFFIX,wensitang.site,DIRECT
  - DOMAIN-SUFFIX,frp-cat.com,DIRECT
  - RULE-SET,cn_domain,DIRECT
  - RULE-SET,cn_ip,DIRECT,no-resolve

  - MATCH,🐟 漏网之鱼

rule-anchor:
  ip: &ip
    type: http
    behavior: ipcidr
    format: mrs

  domain: &domain
    type: http
    behavior: domain
    format: mrs

  class: &class
    type: http
    behavior: classical
    format: text

